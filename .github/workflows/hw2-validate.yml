name: Validate HW2 Regression App

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile features.py train.py predict.py app.py

      - name: Test dashboard and packaged datasets
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Create CI dataset
        run: python tests/create_smoke_data.py --output "$RUNNER_TEMP/flood_smoke.csv"

      - name: Train and evaluate on CI data
        run: python train.py --csv "$RUNNER_TEMP/flood_smoke.csv" --output "$RUNNER_TEMP/flood_outputs"

      - name: Test saved-model prediction
        run: python predict.py --input "$RUNNER_TEMP/flood_smoke.csv" --model "$RUNNER_TEMP/flood_outputs/flood_probability_pipeline.joblib" --output "$RUNNER_TEMP/predictions.csv"

      - name: Verify model metrics and prediction CSV
        run: python tests/check_smoke_outputs.py --outputs "$RUNNER_TEMP/flood_outputs" --predictions "$RUNNER_TEMP/predictions.csv"
